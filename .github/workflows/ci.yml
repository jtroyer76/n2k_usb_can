# On every pull request and push to main: build the firmware, both ways.
#  - without main/secrets.h: what releases ship (WiFi set up on the device)
#  - with secrets.example.h as secrets.h: the development path (settings pre-filled)
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # git describe gives the firmware its version

      - name: No credentials in the repo
        run: test ! -e main/secrets.h

      - name: Build (release configuration)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: idf.py -B build-release build

      - name: Build with secrets.h (development configuration)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: >-
            cp main/secrets.example.h main/secrets.h &&
            idf.py -B build-dev build &&
            rm main/secrets.h
